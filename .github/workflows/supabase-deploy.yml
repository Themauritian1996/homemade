# Met à jour le serveur Supabase SANS terminal : base de données (migrations + référentiels), réglages d'inscription,
# clés d'IA gratuites, fonction d'analyse IA. Tout passe par l'API de gestion de Supabase avec un seul jeton.
# Déclenchement : à chaque mise à jour de main qui touche supabase/, ou à la main
# (onglet Actions → « Serveur Supabase » → Run workflow).
#
# À configurer UNE fois dans GitHub → Settings → Secrets and variables → Actions → Secrets :
#   SUPABASE_ACCESS_TOKEN  jeton du compte qui possède le projet (supabase.com/dashboard/account/tokens)
#   GEMINI_API_KEY         clé gratuite Google AI Studio (aistudio.google.com/apikey)
#   GROQ_API_KEY           facultatif, secours gratuit (console.groq.com/keys)
#   GMAIL_ADDRESS          facultatif : adresse Gmail qui envoie les codes (confirmation de compte, mot de passe oublié)
#   GMAIL_APP_PASSWORD     facultatif : « mot de passe d'application » Google de cette adresse (myaccount.google.com/apppasswords)
#   STRIPE_SECRET_KEY      facultatif : clé secrète Stripe (sk_test_… pour tester sans argent réel) → active l'ACHAT dans l'app
#                          (avec STRIPE_PUBLISHABLE_KEY, lue par le robot « APK Android »)
#   FIREBASE_SERVICE_ACCOUNT facultatif : JSON du compte de service Firebase → notifications même app fermée
#                          (avec GOOGLE_SERVICES_JSON, lu par le robot « APK Android »)
# Projet : homemade au Canada (lcpoxseqtabauemymlss) ; autre projet possible via la variable SUPABASE_PROJECT_REF.
name: Serveur Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Identifiant du projet Supabase (laisser vide = projet de l'app)"
        required: false
        default: ''
      dry_run:
        description: 'Diagnostic seulement (ne rien modifier)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-deploy.mjs'
      - '.github/workflows/supabase-deploy.yml'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF || 'lcpoxseqtabauemymlss' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_CUSTOM_URL: ${{ secrets.AI_CUSTOM_URL }}
      AI_CUSTOM_MODEL: ${{ secrets.AI_CUSTOM_MODEL }}
      AI_CUSTOM_KEY: ${{ secrets.AI_CUSTOM_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Diagnostic (jeton, projet, migrations)
        run: |
          [ -n "$GEMINI_API_KEY$GROQ_API_KEY$AI_CUSTOM_URL" ] || echo "::warning::Aucune clé d'IA gratuite (GEMINI_API_KEY…) : l'app fonctionnera en saisie manuelle."
          node scripts/supabase-deploy.mjs check

      - name: Base de données (migrations manquantes + référentiels)
        if: ${{ !inputs.dry_run }}
        run: node scripts/supabase-deploy.mjs migrate

      - name: Réglages d'inscription et courriels
        if: ${{ !inputs.dry_run }}
        run: node scripts/supabase-deploy.mjs auth

      - name: Clés d'IA (secrets serveur, jamais dans l'app)
        if: ${{ !inputs.dry_run }}
        run: |
          args=()
          for name in GEMINI_API_KEY GROQ_API_KEY AI_CUSTOM_URL AI_CUSTOM_MODEL AI_CUSTOM_KEY STRIPE_SECRET_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then args+=("$name=$value"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
          else
            echo "Aucune clé à enregistrer."
          fi

      - name: Fonctions du serveur (IA, paiements, commandes)
        if: ${{ !inputs.dry_run }}
        run: |
          # Envoi par l'API (le serveur Supabase assemble chaque fonction). 3 essais par fonction : l'API de gestion de
          # Supabase a parfois des erreurs passagères. verify_jwt vient de supabase/config.toml.
          for fn in analyze-meal order-action create-payment-intent stripe-connect-onboard stripe-webhook stripe-return push-notify; do
            ok=""
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then ok=1; break; fi
              echo "$fn : essai $attempt échoué, nouvel essai dans $((attempt * 20)) s…"
              sleep $((attempt * 20))
            done
            [ -n "$ok" ] || { echo "::error::Fonction $fn non déployée"; exit 1; }
          done

      - name: Paiements Stripe (webhooks, si la clé est fournie)
        if: ${{ !inputs.dry_run }}
        run: node scripts/supabase-deploy.mjs stripe

      - name: Notifications push (Firebase, si le compte de service est fourni)
        if: ${{ !inputs.dry_run }}
        run: node scripts/supabase-deploy.mjs push

      - name: Test de bout en bout sur le serveur réel (compte temporaire, supprimé ensuite)
        if: ${{ !inputs.dry_run }}
        # Étiquette de test (scripts/fixtures) : l'IA doit y lire lait, œufs, blé (⇒ gluten) et « Peut contenir : noix ».
        run: node scripts/supabase-deploy.mjs smoke scripts/fixtures/etiquette-test.png
