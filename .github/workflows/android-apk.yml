# Construit l'APK Android de test dans le cloud GitHub, puis le publie dans « Releases ».
# Déclenchement : à chaque mise à jour de la branche main (hors documentation), ou à la main
# (onglet Actions → « APK Android » → Run workflow).
# Aucun compte Expo requis : build natif Gradle sur un runner Ubuntu.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Uniquement quand l'app change (le dernier motif qui correspond l'emporte) : les changements du serveur seul
    # (migrations, fonctions, robot serveur) ne refabriquent pas l'APK. prompt.ts est partagé avec l'IA locale de l'app.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!supabase/**'
      - 'supabase/functions/analyze-meal/prompt.ts'
      - '!scripts/supabase-deploy.mjs'
      - '!scripts/test-*.mjs'
      - '!scripts/bench-local-ai.mjs'
      - '!scripts/fixtures/**'
      - '!scripts/android-e2e.mjs'
      - '!scripts/check-i18n.mjs'
      - '!scripts/vendor-leaflet.mjs'
      - '!.github/workflows/supabase-deploy.yml'
      - '!.github/workflows/android-e2e.yml'

permissions:
  contents: write # nécessaire pour créer la Release qui héberge l'APK

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Valeurs PUBLIQUES (embarquées dans l'app) : Settings → Secrets and variables → Actions → Variables.
      # URL et clé PUBLIQUE Supabase : lues automatiquement sur le projet (étape « Adresse du serveur »).
      # Clé PUBLIABLE Stripe (pk_…, faite pour être dans l'app) : secret STRIPE_PUBLISHABLE_KEY ou variable.
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # IA en ligne (Edge Function `analyze-meal` : Gemini gratuit, secours Groq) toujours active dans l'APK ; l'app
      # passe d'elle-même en saisie manuelle si le serveur ne répond pas. (Une ancienne variable
      # EXPO_PUBLIC_AI_PROVIDER=none la désactivait : elle est désormais ignorée.)
      EXPO_PUBLIC_AI_PROVIDER: server
      # Lien de téléchargement ajouté aux invitations partagées depuis l'app : toujours la dernière version.
      # (Dépôt de téléchargement public si PUBLIC_RELEASES_REPO est défini, sinon ce dépôt-ci.)
      EXPO_PUBLIC_BETA_DOWNLOAD_URL: ${{ vars.EXPO_PUBLIC_BETA_DOWNLOAD_URL || format('https://github.com/{0}/releases/latest/download/Homemade.apk', vars.PUBLIC_RELEASES_REPO || github.repository) }}
      # La carte (Leaflet + OpenStreetMap) ne demande aucune clé.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: npm ci

      # Même projet que le robot « Serveur Supabase » : l'app et le serveur ne peuvent pas diverger.
      # Sans jeton, on garde les anciennes variables EXPO_PUBLIC_SUPABASE_URL / _ANON_KEY.
      - name: Adresse du serveur (projet Supabase)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'lcpoxseqtabauemymlss' }}
          FALLBACK_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          FALLBACK_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            node scripts/supabase-deploy.mjs app-config
          else
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : utilisation des variables EXPO_PUBLIC_SUPABASE_URL / _ANON_KEY."
            echo "EXPO_PUBLIC_SUPABASE_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
          fi

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      # Numéro de la version de test dans l'app (Profil, tout en bas : « v1.0.0 (N) ») et pour Android (versionCode) :
      # chaque APK remplace proprement la précédente et on voit tout de suite laquelle est installée.
      - name: Numéro de version
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const n = Number(process.env.GITHUB_RUN_NUMBER);
            app.expo.android = { ...app.expo.android, versionCode: n };
            app.expo.extra = { ...app.expo.extra, buildNumber: n };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Version de test n°' + n);
          "

      - name: Génération du projet Android natif
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nom du fichier
        id: apk
        run: |
          NAME="Homemade-test-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          # Copie au nom FIXE : https://github.com/<dépôt>/releases/latest/download/Homemade.apk pointe toujours vers la dernière version.
          cp "$NAME" Homemade.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Notes de version (pour les testeurs)
        run: |
          cat > notes.md <<NOTES
          ## 📲 Installer Homemade (Android)
          1. Sur le téléphone, touche **Homemade.apk** ci-dessous pour le télécharger.
          2. Ouvre le fichier. Si Android bloque : **Paramètres → Autoriser cette source**, puis reviens.
          3. **Installer**. Si Play Protect avertit : **Plus de détails → Installer quand même** (app de test hors Play Store).
          4. Ouvre l'app → **Créer un compte** → entre le **code d'invitation** reçu.

          Mise à jour : installe simplement la nouvelle version par-dessus, ton compte est conservé.
          Version installée : **Profil**, tout en bas → « v1.0.0 (${GITHUB_RUN_NUMBER}) » pour cette version.
          Le téléphone rouvre l'ancien fichier ? Supprime les anciens « Homemade.apk » de **Téléchargements**, ou prends **Homemade-test-${GITHUB_RUN_NUMBER}.apk** ci-dessous.
          Langue : touche **FR / EN** en haut de l'accueil (ou Profil → Paramètres). _English available: tap FR / EN._

          _Version de test n°${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}_
          NOTES

      - name: Publication dans Releases (ce dépôt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" Homemade.apk "${{ steps.apk.outputs.name }}" \
            --title "Homemade — version de test n°${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --latest

      # Facultatif : garder le code PRIVÉ et publier l'APK dans un petit dépôt PUBLIC, accessible à tous tes testeurs.
      # Variable PUBLIC_RELEASES_REPO (ex. Themauritian1996/homemade-app) + secret PUBLIC_RELEASES_TOKEN (voir le guide).
      - name: Publication publique (dépôt de téléchargement)
        if: ${{ vars.PUBLIC_RELEASES_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_RELEASES_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PUBLIC_RELEASES_TOKEN manquant : voir GUIDE-UTILISATION.md, Étape 4 (option B)."
            exit 1
          fi
          gh release create "apk-${GITHUB_RUN_NUMBER}" Homemade.apk \
            --repo "$PUBLIC_REPO" \
            --title "Homemade — version de test n°${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --latest
          echo "Lien pour tes testeurs : https://github.com/$PUBLIC_REPO/releases/latest/download/Homemade.apk"

      # APK « émulateur » (processeur x86_64 des serveurs GitHub), NON publiée : sert uniquement au robot
      # « Test Android (émulateur) ». L'APK des testeurs, elle, vise les vrais téléphones (ARM) et reste légère.
      - name: APK de test pour l'émulateur (x86_64)
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../Homemade-emulateur.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk-emulateur
          path: Homemade-emulateur.apk
          retention-days: 7
          if-no-files-found: ignore
