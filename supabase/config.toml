# Configuration Supabase CLI (local + déploiement). Les valeurs absentes prennent les défauts du CLI.
project_id = "homemade"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
file_size_limit = "5MiB"

[auth]
site_url = "homemade://"
additional_redirect_urls = ["homemade://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# ⚠️ Phase de test : confirmation par courriel désactivée (SMTP gratuit limité). Remettre à true avant le lancement.
enable_confirmations = false
double_confirm_changes = true

# Stripe appelle ce webhook sans JWT Supabase : la signature Stripe fait office d'authentification.
[functions.stripe-webhook]
verify_jwt = false

# Page de retour du formulaire Stripe (ouverte par le navigateur, sans JWT) : renvoie vers l'app.
[functions.stripe-return]
verify_jwt = false

# Notifications push : appelée par la base (pg_net) avec un secret partagé, pas par un utilisateur.
[functions.push-notify]
verify_jwt = false
